server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA routing — every unknown path falls back to index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Proxy API calls to the backend (docker-compose service name: server).
  # In production the client is hosted on Vercel, which rewrites /api/* to the
  # deployed API via vercel.json — this block is only used by docker-compose.
  location /api/ {
    proxy_pass http://server:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /healthz {
    add_header Content-Type text/plain;
    return 200 'ok';
  }
}
