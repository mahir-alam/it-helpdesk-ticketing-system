# Local full-stack run. Production uses Supabase (Postgres) + Render (API) +
# Vercel (client); this compose file stands up an equivalent stack locally.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: helpdesk
      POSTGRES_PASSWORD: helpdesk
      POSTGRES_DB: helpdesk
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U helpdesk']
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      DATABASE_URL: postgresql://helpdesk:helpdesk@db:5432/helpdesk
      DIRECT_URL: postgresql://helpdesk:helpdesk@db:5432/helpdesk
      JWT_SECRET: local-dev-secret-change-me
      NODE_ENV: production
      PORT: '4000'
      CLIENT_URL: http://localhost:8080
      ENABLE_CRON: 'true'
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      INTEGRATION_API_KEY: ${INTEGRATION_API_KEY:-fleet-tracker-dev-key}
    ports:
      - '4000:4000'
    depends_on:
      db:
        condition: service_healthy

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    ports:
      - '8080:80'
    depends_on:
      - server

volumes:
  db-data:
